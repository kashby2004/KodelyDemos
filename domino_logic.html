<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Lab: Domino Logic Circuit Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            text-align: center;
        }

        p {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .control-panel {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        .gate-select {
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #3498db;
            color: #2c3e50;
            cursor: pointer;
        }

        .toggle-btn {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-off {
            background-color: #e74c3c;
            color: white;
        }

        .btn-on {
            background-color: #2ecc71;
            color: white;
        }

        .canvas-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #ffffff;
        }

        .truth-table {
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            width: 320px;
            text-align: center;
        }

        .truth-table th,
        .truth-table td {
            padding: 10px;
            border: 1px solid #edf2f7;
        }

        .truth-table th {
            background-color: #34495e;
            color: white;
        }

        .active-row {
            background-color: #e8f8f5;
            font-weight: bold;
            color: #2ecc71;
        }
    </style>
</head>

<body>

    <h1>Domino Logic Circuit Simulator</h1>
    <p>Toggle the inputs to see how logic gates route signals to the output line!</p>

    <div class="control-panel">
        <label for="gateType"><strong>Gate Type:</strong></label>
        <select id="gateType" class="gate-select" onchange="resetCircuit()">
            <option value="AND">AND Gate (Both Required)</option>
            <option value="OR">OR Gate (Either Required)</option>
        </select>

        <button id="btnA" class="toggle-btn btn-off" onclick="toggleInput('A')">Input A: 0 (Standing)</button>
        <button id="btnB" class="toggle-btn btn-off" onclick="toggleInput('B')">Input B: 0 (Standing)</button>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas" width="700" height="350"></canvas>
    </div>

    <table class="truth-table" id="truthTable">
        <thead>
            <tr>
                <th>Input A</th>
                <th>Input B</th>
                <th>Output</th>
            </tr>
        </thead>
        <tbody>
            <tr id="row-0-0">
                <td>0</td>
                <td>0</td>
                <td id="out-0-0">0</td>
            </tr>
            <tr id="row-1-0">
                <td>1</td>
                <td>0</td>
                <td id="out-1-0">0</td>
            </tr>
            <tr id="row-0-1">
                <td>0</td>
                <td>1</td>
                <td id="out-0-1">0</td>
            </tr>
            <tr id="row-1-1">
                <td>1</td>
                <td>1</td>
                <td id="out-1-1">0</td>
            </tr>
        </tbody>
    </table>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let inputA = false;
        let inputB = false;
        let signalProgress = 0; // Animation tracker

        function toggleInput(type) {
            if (type === 'A') {
                inputA = !inputA;
                document.getElementById('btnA').className = inputA ? 'toggle-btn btn-on' : 'toggle-btn btn-off';
                document.getElementById('btnA').innerText = `Input A: ${inputA ? '1 (FALLEN)' : '0 (Standing)'}`;
            } else {
                inputB = !inputB;
                document.getElementById('btnB').className = inputB ? 'toggle-btn btn-on' : 'toggle-btn btn-off';
                document.getElementById('btnB').innerText = `Input B: ${inputB ? '1 (FALLEN)' : '0 (Standing)'}`;
            }
            signalProgress = 0; // Restart animation sequence on toggle
            updateTruthTable();
        }

        function resetCircuit() {
            signalProgress = 0;
            updateTruthTable();
        }

        function updateTruthTable() {
            const gate = document.getElementById('gateType').value;

            // Clean active classes
            for (let r of ['0-0', '1-0', '0-1', '1-1']) {
                document.getElementById(`row-${r}`).className = '';
                let valA = r.split('-')[0] === '1';
                let valB = r.split('-')[1] === '1';
                let expectedOut = gate === 'AND' ? (valA && valB) : (valA || valB);
                document.getElementById(`out-${r}`).innerText = expectedOut ? '1' : '0';
            }

            // Highlight current row
            let currentRowId = `row-${inputA ? '1' : '0'}-${inputB ? '1' : '0'}`;
            document.getElementById(currentRowId).className = 'active-row';
        }

        function drawDominoChain(startX, startY, endX, endY, isTrue, color) {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.lineWidth = 6;
            ctx.strokeStyle = isTrue ? color : '#cbd5e0';
            ctx.stroke();

            // Draw directional movement dashes if active
            if (isTrue && signalProgress > 0) {
                ctx.save();
                ctx.setLineDash([4, 8]);
                ctx.lineDashOffset = -signalProgress * 2;
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawGateBox(x, y, type, isActive) {
            ctx.fillStyle = isActive ? '#3498db' : '#95a5a6';
            ctx.fillRect(x, y, 90, 60);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#2c3e50';
            ctx.strokeRect(x, y, 90, 60);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(type, x + 45, y + 36);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const gate = document.getElementById('gateType').value;

            // Evaluate logic condition
            let gatePassed = gate === 'AND' ? (inputA && inputB) : (inputA || inputB);

            // Progress the animated trace signals
            if (signalProgress < 100) signalProgress += 1.5;

            // Draw input chains (Blue for track A, Green for track B)
            drawDominoChain(50, 100, 300, 140, inputA, '#3498db');
            drawDominoChain(50, 250, 300, 210, inputB, '#2ecc71');

            // Source Input Nodes
            ctx.beginPath();
            ctx.arc(50, 100, 10, 0, Math.PI * 2);
            ctx.fillStyle = inputA ? '#3498db' : '#7f8c8d';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(50, 250, 10, 0, Math.PI * 2);
            ctx.fillStyle = inputB ? '#2ecc71' : '#7f8c8d';
            ctx.fill();

            // Render Center Logic Gate
            drawGateBox(300, 145, gate, gatePassed);

            // Render Output Trace Line (Changes color to high-visibility orange if triggered)
            drawDominoChain(390, 175, 650, 175, gatePassed, '#e67e22');

            // End Target Node
            ctx.beginPath();
            ctx.arc(650, 175, 12, 0, Math.PI * 2);
            ctx.fillStyle = gatePassed ? '#e67e22' : '#7f8c8d';
            ctx.fill();

            requestAnimationFrame(animate);
        }

        // Initialize state view loop
        updateTruthTable();
        animate();
    </script>
</body>

</html>
